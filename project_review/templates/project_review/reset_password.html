{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Project Review</title>
    <link rel="stylesheet" href="{% static 'project_review/css/styles.css' %}?v=12">
    <link rel="icon" type="image/png" href="{% static 'project_review/images/logo.png' %}">
    <script>window.CRM_USER_ID = "{{ user.username|default:'guest' }}";</script>
    <script src="{% static 'project_review/js/theme_toggle.js' %}?v=1.5"></script>
</head>
<body id="body2">
    <div class="pos2">
        <h2>Reset Password</h2>

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div style="color: var(--btn-color, #f50e06); margin-bottom: 15px;">{{ message }}</div>
                {% elif message.tags == 'success' %}
                    <div style="color: green; margin-bottom: 15px;">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="password" placeholder="New Password" name="password" required>

            <input type="password" placeholder="Confirm New Password" name="confirm_password" required>

            <button type="submit" id="button">Next</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{% url 'project_review:login' %}" style="color: var(--btn-color, #f50e06); text-decoration: none;">Back to Login</a>
        </div>
    </div>
</body>
</html>
