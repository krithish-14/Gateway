{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Project Review</title>
    <link rel="stylesheet" href="{% static 'project_review/css/styles.css' %}?v=12">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'project_review/images/logo.png' %}">
    <script>window.CRM_USER_ID = "{{ user.username|default:'guest' }}";</script>
    <script src="{% static 'project_review/js/theme_toggle.js' %}?v=20.0"></script>
</head>

<body id="body2">
    <div class="pos2">
        <h2>Create Account</h2>
        {% if messages %}
        {% for message in messages %}
        {% if message.tags == 'error' %}
        <div class="notice" style="color: red;">{{ message }}</div>
        {% else %}
        <div class="notice" style="color: green;">{{ message }}</div>
        {% endif %}
        {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email" required>
            <select name="role" id="role-select" required onchange="toggleRoleFields()">
                <option value="" disabled selected>Select role</option>
                <option value="startup">Startup</option>
                <option value="investor">Investor</option>
            </select>

            <!-- Investor Specific Fields -->
            <div id="investor-fields" style="display: none;" class="fade-in">
                <input type="text" name="company_name" placeholder="Company Name">
                <input type="url" name="company_website" placeholder="Company Website (URL)">
                <input type="url" name="linkedin_profile" placeholder="LinkedIn Profile (URL)">
            </div>

            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit" id="button">Register</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="{% url 'project_review:login' %}" style="color: var(--btn-color, #f50e06); text-decoration: none;">Back to Login</a>
        </div>
    </div>

    <script>
        function toggleRoleFields() {
            const roleSelect = document.getElementById('role-select');
            const investorFields = document.getElementById('investor-fields');

            if (roleSelect.value === 'investor') {
                investorFields.style.display = 'block';
            } else {
                investorFields.style.display = 'none';
            }
        }
    </script>

</body>

</html>
