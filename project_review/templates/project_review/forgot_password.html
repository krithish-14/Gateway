{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Project Review</title>
  <link rel="icon" type="image/png" href="{% static 'project_review/images/logo.png' %}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'project_review/css/styles.css' %}?v=12">
    <script>window.CRM_USER_ID = "{{ user.username|default:'guest' }}";</script>
    <script src="{% static 'project_review/js/theme_toggle.js' %}?v=1.5"></script>
</head>

<body id="body2">
  <!-- Non-blocking top notification bar -->
  <div id="notifyBar"
    style="position:fixed;top:0;left:0;right:0;padding:10px 16px;text-align:center;font-weight:600;display:none;z-index:9999">
  </div>
  {% if messages %}
  <script>
    (function () {
      var bar = document.getElementById('notifyBar');
      var msg = '';
      var bg = '#e6fff5';
      var color = '#0b6';
      {% for message in messages %}
      {% if message.tags == 'success' %}
      msg = 'Link is sent to your email for reset.';
      bg = '#e6fff5';
      color = '#0b6';
      {% elif message.tags == 'error' %}
      msg = '{{ message|escapejs }}';
      bg = '#ffe6e6';
      color = '#b00020';
      {% endif %}
      {% endfor %}
      if (msg) {
        bar.textContent = msg;
        bar.style.background = bg;
        bar.style.color = color;
        bar.style.display = 'block';
        setTimeout(function () { bar.style.display = 'none'; }, 5000);
      }
    })();
  </script>
  {% endif %}

  <div class="pos2">
    <h2>Forgot Password</h2>

    <p style="color: #666; margin-bottom: 20px;">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <form method="post" action="{% url 'project_review:forgot_password' %}">
      {% csrf_token %}
      <input type="email" placeholder="Email Address" name="email" required>

      <button type="submit" id="button">Submit</button>
    </form>

    <div style="margin-top: 15px;">
      <a href="{% url 'project_review:login' %}" style="color: var(--btn-color, #f50e06); text-decoration: none;">Back to Login</a>
    </div>
  </div>
</body>

</html>
